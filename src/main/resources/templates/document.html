            </el-form-item>
            <el-form-item label="字体样式" label-width='120px'>
                <el-checkbox v-model="formats.database.bold">加粗</el-checkbox>
            </el-form-item>
            <el-form-item label="" label-width='120px'>
            </el-form-item>
            <el-form-item label="表名称格式" label-width='120px'>
                <el-input v-model="formats.table.format" size="small"></el-input>
            </el-form-item>
            <el-form-item label="字体大小" label-width='120px'>
                <el-slider :min="10" :max="25" v-model="formats.table.fontSize" size="small"></el-slider>
            </el-form-item>
            <el-form-item label="字体样式" label-width='120px'>
                <el-checkbox v-model="formats.table.bold">加粗</el-checkbox>
            </el-form-item>
            <el-form-item label="" label-width='120px'>
            </el-form-item>
            <el-form-item label="文件名称格式" label-width='120px'>
                <el-input v-model="formats.fileName" size="small"></el-input>
            </el-form-item>
        </el-form>
        <span slot="footer" class="dialog-footer">
    <el-button size="small" @click="formatDialogVisible = false">取 消</el-button>
    <el-button size="small" type="primary" @click="formatDialogVisible = false">确 定</el-button>
  </span>
    </el-dialog>

</div>
<script>
    // 创建一个新的 Vue 实例
    new Vue({
        el: '#app',
        data: {
            data: [],
            loading: false,
            fieldDialogVisible: false,
            formatDialogVisible: false,
            allColumns: [],
            defaultColumns: [],
            defaultProps: {
                children: 'children',
                label: 'labelName'
            },
            formats: {
                database: {
                    format: '数据库名称 ${databaseName}',
                    fontSize: 20,
                    bold: true
                },
                table: {
                    format: '${tableName} ${description}',
                    fontSize: 15,
                    bold: false
                },
                fileName: '表结构文档_yyyy-MM-dd'
            },
            pdf: ''
        },
        methods: {
            async selectNode(data, selected) {
                let structureTree = this.$refs.structureTree;
                let node = structureTree.getNode(data)
                if (selected && data.childrenCount !== 0 && node.level === 1) {
                    let tables = await this.getTables(data)
                    // 新增子节点
                    structureTree.updateKeyChildren(data.nodeId, tables)
                    this.$nextTick(() => {
                        for (let table of tables) {
                            structureTree.setChecked(table, true)
                            structureTree.getNode(table).isLeaf = true
                        }
                    })
                } else if (!selected && node.level === 2) {
                    structureTree.setChecked(data, false)
                } else if (!selected && node.level === 1 && !structureTree.getHalfCheckedKeys().includes(data.nodeId)) {
                    structureTree.setChecked(data, false)
                    for (let childNode of node.childNodes) {
                        structureTree.setChecked(childNode.data, false)
                    }
                }
            },
            async loadNode(node, resolve) {
                try {
                    this.loading = true;
                    if (node.level === 0) {
                        let databases = await this.getDatabases();
                        resolve(databases);
                        this.$nextTick(() => {
                            let structureTree = this.$refs.structureTree;
                            for (let database of databases) {
                                database.childrenCount === 0 && (structureTree.getNode(database).isLeaf = true)
                            }
                        })
                    } else if (node.level === 1) {
                        let tables = await this.getTables(node.data);
                        resolve(tables);
                        this.$nextTick(() => {
                            let structureTree = this.$refs.structureTree;
                            for (let table of tables) {
                                structureTree.getNode(table).isLeaf = true
                            }
                        })
                    }
                } catch (err) {
                    this.showMessage('error', err)
                    resolve([])
                } finally {
                    this.loading = false;
                }
            },
            getDatabases() {
                return new Promise((resolve, reject) => {
                    axios.get('/document/getDatabases').then(res => {
                        if (res.data.code === 200) {
                            resolve(res.data.data);
                        } else {
                            reject("数据加载失败");
                        }
                    }).catch(err => {
                        reject(err);
                    });
                });
            },
            getTables(data) {
                let schemaName = data.labelName;
                let parentNodeId = data.nodeId;
                return new Promise((resolve, reject) => {
                    axios.get('/document/getTables', {params: {parentNodeId, schemaName}}).then(res => {
                        if (res.data.code === 200) {
                            resolve(res.data.data);
                        } else {
                            reject("数据加载失败");
                        }
                    }).catch(err => {
                        reject(err);
                    });
                });
            },
            getTableColumns() {
                axios.get('/document/getTableColumnInfo').then(res => {
                    if (res.data.code === 200) {
                        this.allColumns = res.data.data.allColumns;
                        this.defaultColumns = res.data.data.defaultColumns;
                    } else {
                        this.showMessage("error", "数据加载失败!")
                    }
                }).catch(err => {
                    this.showMessage("error", "数据加载失败!")
                })
            },
            preview() {
                if (this.getCheckedNodes().length === 0) {
                    this.showMessage("error", "当前未选中任何数据表!")
                    return;
                }
                this.loading = true
                axios({
                    method: 'post',
                    url: '/document/pdf/preview',
                    responseType: 'arraybuffer', // 指定响应类型为二进制流
                    data: {dataList: this.getCheckedNodes(), defaultColumns: this.defaultColumns, formats: this.formats}
                }).then(res => {
                    if (res.status === 200) {
                        const blob = new Blob([res.data], {type: "application/pdf"});
                        this.pdf = URL.createObjectURL(blob);
                    } else {
                        this.showMessage("error", "预览失败!")
                    }
                    this.loading = false
                }).catch(err => {
                    this.showMessage("error", err.message)
                    this.loading = false
                });
            },
            download(cmd) {
                switch (cmd) {
                    case "1":
                        this.downloadWord();
                        break;
                    case "2":
                        this.downloadPdf();
                        break;
                    case "3":
                        this.downloadMarkdown();
                        break;
                    case "4":
                        this.downloadHtml();
                        break;
                }
            },
            downloadWord() {
                if (this.getCheckedNodes().length === 0) {
                    this.showMessage("error", "当前未选中任何数据表")
                    return;
                }
                this.loading = true
                axios({
                    method: 'post',
                    url: '/document/word/download',
                    responseType: 'blob', // 指定响应类型为二进制流
                    data: {
                        dataList: this.getCheckedNodes(),
                        contentType: this.contentType,
                        defaultColumns: this.defaultColumns,
                        formats: this.formats
                    }
                }).then(res => {
                    if (res.status === 200) {
                        let blob = new Blob([res.data])
                        let url = window.URL.createObjectURL(blob)
                        let downloadElement = document.createElement('a')
                        downloadElement.style.display = 'none'
                        downloadElement.href = url
                        downloadElement.setAttribute('download', decodeURIComponent(res.headers['filename']))
                        document.body.appendChild(downloadElement)
                        downloadElement.click()
                        document.body.removeChild(downloadElement) // 下载完成移除元素
                        window.URL.revokeObjectURL(url) // 释放掉blob对象
                        this.showMessage("success", "下载成功!")
                    } else {
                        this.showMessage("error", "下载失败!")
                    }
                    this.loading = false
                }).catch(err => {
                    this.showMessage("error", err.message)
                    this.loading = false
                });
            },
            downloadPdf() {
                if (this.getCheckedNodes().length === 0) {
                    this.showMessage("error", "当前未选中任何数据表!")
                    return;
                }
                this.loading = true
                axios({
                    method: 'post',
                    url: '/document/pdf/download',
                    responseType: 'blob', // 指定响应类型为二进制流
                    data: {
                        dataList: this.getCheckedNodes(),
                        contentType: this.contentType,
                        defaultColumns: this.defaultColumns,
                        formats: this.formats
                    }
                }).then(res => {
                    if (res.status === 200) {
                        let blob = new Blob([res.data])
                        let url = window.URL.createObjectURL(blob)
                        let downloadElement = document.createElement('a')
                        downloadElement.style.display = 'none'
                        downloadElement.href = url
                        downloadElement.setAttribute('download', decodeURIComponent(res.headers['filename']))
                        document.body.appendChild(downloadElement)
                        downloadElement.click()
                        document.body.removeChild(downloadElement) // 下载完成移除元素
                        window.URL.revokeObjectURL(url) // 释放掉blob对象
                        this.showMessage("success", "下载成功!")
                    } else {
                        this.showMessage("error", "下载失败!")
                    }
                    this.loading = false
                }).catch(err => {
                    this.showMessage("error", err.message)
                    this.loading = false
                });
            },
            downloadMarkdown() {
                if (this.getCheckedNodes().length === 0) {
                    this.showMessage("error", "当前未选中任何数据表!")
                    return;
                }
                this.loading = true
                axios({
                    method: 'post',
                    url: '/document/markdown/download',
                    responseType: 'blob', // 指定响应类型为二进制流
                    data: {
                        dataList: this.getCheckedNodes(),
                        contentType: this.contentType,
                        defaultColumns: this.defaultColumns,
                        formats: this.formats
                    }
                }).then(res => {
                    if (res.status === 200) {
                        let blob = new Blob([res.data])
                        let url = window.URL.createObjectURL(blob)
                        let downloadElement = document.createElement('a')
                        downloadElement.style.display = 'none'
                        downloadElement.href = url
                        downloadElement.setAttribute('download', decodeURIComponent(res.headers['filename']))
                        document.body.appendChild(downloadElement)
                        downloadElement.click()
                        document.body.removeChild(downloadElement) // 下载完成移除元素
                        window.URL.revokeObjectURL(url) // 释放掉blob对象
                        this.showMessage("success", "下载成功!")
                    } else {
                        this.showMessage("error", "下载失败!")
                    }
                    this.loading = false
                }).catch(err => {
                    this.showMessage("error", err.message)
                    this.loading = false
                });
            },
            downloadHtml() {
                if (this.getCheckedNodes().length === 0) {
                    this.showMessage("error", "当前未选中任何数据表!")
                    return;
                }
                this.loading = true
                axios({
                    method: 'post',
                    url: '/document/html/download',
                    responseType: 'blob', // 指定响应类型为二进制流
                    data: {
                        dataList: this.getCheckedNodes(),
                        contentType: this.contentType,
                        defaultColumns: this.defaultColumns,
                        formats: this.formats
                    }
                }).then(res => {
                    if (res.status === 200) {
                        let blob = new Blob([res.data])
                        let url = window.URL.createObjectURL(blob)
                        let downloadElement = document.createElement('a')
                        downloadElement.style.display = 'none'
                        downloadElement.href = url
                        downloadElement.setAttribute('download', decodeURIComponent(res.headers['filename']))
                        document.body.appendChild(downloadElement)
                        downloadElement.click()
                        document.body.removeChild(downloadElement) // 下载完成移除元素
                        window.URL.revokeObjectURL(url) // 释放掉blob对象
                        this.showMessage("success", "下载成功!")
                    } else {
                        this.showMessage("error", "下载失败!")
                    }
                    this.loading = false
                }).catch(err => {
                    this.showMessage("error", err.message)
                    this.loading = false
                });
            },
            getCheckedNodes() {
                let tree = this.$refs.structureTree;
                let checkedNodes = tree.getCheckedNodes();
                let parentNodeIds = new Set(checkedNodes.filter(node => node.parentNodeId != null).map(node => node.parentNodeId));
                for (let parentNodeId of parentNodeIds) {
                    let node = tree.getNode(parentNodeId).data;
                    if (!checkedNodes.includes(node)) {
                        checkedNodes.push(node)
                    }
                }
                return checkedNodes;
            },
            showMessage(type, message) {
                this.$message({
                    message: message,
                    type: type,
                });
            },
            initChangeBoxWidthEvent() {
                let dragHandle = document.getElementById("drag-tip");
                let startX, startWidth;
                dragHandle.addEventListener("mousedown", function (e) {
                    startX = e.clientX;
                    startWidth = parseInt(document.defaultView.getComputedStyle(document.getElementById("context")).width, 10);
                    document.addEventListener("mousemove", doDrag, false);
                    document.addEventListener("mouseup", stopDrag, false);
                }, false);

                function doDrag(e) {
                    let reduceWidth = e.clientX - startX;
                    let newWidth = startWidth - reduceWidth;
                    if (newWidth > 0) {
                        let container = document.getElementById("context");
                        let aside = document.getElementById("aside");
                        container.style.left = (container.style.left + reduceWidth) + 'px';
                        container.style.width = newWidth + "px";
                        aside.style.width = e.clientX + 'px'
                    }
                }

                function stopDrag() {
                    document.removeEventListener("mousemove", doDrag, false);
                    document.removeEventListener("mouseup", stopDrag, false);
                }
            },
        },
        mounted: function () {
            this.getTableColumns();
            this.initChangeBoxWidthEvent()
        }
    });
</script>
</body>
</html>
