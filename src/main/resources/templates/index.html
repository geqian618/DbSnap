<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>连接数据库</title>
    <link rel="icon" type="image/x-icon" href="/icon/favicon.ico">
    <script src="/js/axios.min.js"></script>
    <script src="/js/vue.js"></script>
    <!-- 引入样式 -->
    <link rel="stylesheet" href="/css/element.css">
    <link rel="stylesheet" href="/css/normalize.css">
    <!-- 引入组件库 -->
    <script src="/js/element.js"></script>

    <link rel="stylesheet" href="/css/index.css">

</head>
<body>
<div id="app">
    <div class="container">
        <div class="action-items">
            <el-tooltip class="item" effect="dark" content="前往Gitee" placement="bottom">
                <a href="https://gitee.com/geqian618/DbSnap">
                    <img src="/icon/svg/gitee.svg" width="35">
                </a>
            </el-tooltip>
            <el-tooltip class="item" effect="dark" content="前往Github" placement="bottom">
                <a href="https://github.com/geqian618/DBSnap">
                    <img src="/icon/svg/github.svg" width="35">
                </a>
            </el-tooltip>

            <el-popover placement="bottom" width="300" trigger="hover">
                <img src="/images/赞赏码.jpg" width="300">
                <img slot="reference" src="/icon/svg/admire.svg" width="35">
            </el-popover>

        </div>
        <div class="icon-grid">
            <div class="icon-item unselectable"
                 v-for="(database, index) in databases"
                 v-if="database.developed"
                 :key="index"
                 @click="selectDatabase(database)">
                <img :src="database.icon" width="100" height="100" alt=""/>
                <span>{{ database.name || database.type }}</span>
            </div>
        </div>
    </div>

    <el-dialog v-loading="loading"
               element-loading-text="正在加载中..."
               element-loading-spinner="el-icon-loading"
               element-loading-background="rgba(0, 0, 0, 0.8)"
               width="600px"
               title="数据源"
               @close="closeDialog"
               :visible.sync="dialogFormVisible">
        <el-form :model="form" :rules="rules" ref="ruleForm">
            <el-form-item v-for="(value, key, index) in database"
                          :key="index"
                          :label="value.label"
                          :label-width="formLabelWidth"
                          :prop="key">
                <el-input v-model="form[key]" :placeholder="`请输入${value.label}`"></el-input>
            </el-form-item>
        </el-form>

        <div slot="footer" class="dialog-footer">
            <el-button @click="dialogFormVisible = false">取 消</el-button>
            <el-button type="primary" @click="submitForm('ruleForm')">确 定</el-button>
        </div>
    </el-dialog>
</div>

<script th:inline="javascript">
    // 创建一个新的 Vue 实例
    new Vue({
        el: '#app',
        data: {
            dialogFormVisible: false,
            appreciationCodeVisible: false,
            formLabelWidth: '120px',
            loading: false,
            form: {},
            database: {},
            rules: {
                host: [
                    {required: true, message: '主机不能为空', trigger: 'blur'}
                ],
                port: [
                    {required: true, message: '端口不能为空', trigger: 'blur'}
                ],
                database: [
                    {required: true, message: '数据不能为空', trigger: 'blur'}
                ],
            },
            databases: [],
        },
        mounted() {

            this.getDatabaseConfig()

            document.addEventListener('keydown', (event) => {
                if (event.key === 'Enter') {
                    this.submitForm('ruleForm')
                }
            });
        },
        methods: {
            selectDatabase(args) {
                this.dialogFormVisible = true;
                const obj = JSON.parse(JSON.stringify(args))
                for (let key in obj) {
                    const value = obj[key];
                    this.$set(this.form, key, '')
                    if (typeof value !== 'object') {
                        Reflect.deleteProperty(obj, key);
                        this.form[key] = value;
                    } else {
                        this.form[key] = value.value
                    }
                }
                this.database = obj
            },
            submitForm(formName) {
                this.$refs[formName].validate((valid) => {
                    if (valid) {
                        this.connection()
                    } else {
                        return false;
                    }
                });
            },
            closeDialog() {
                this.$refs['ruleForm'].resetFields();
            },
            connection() {
                this.loading = true
                axios.post('/dataSource/connection', this.form).then(res => {
                    if (res.data.code === 200) {
                        this.showMessage('success', res.data.message)
                        setTimeout(() => {
                            window.location.href = '/document';
                        }, 500)
                    } else {
                        this.showMessage('error', res.data.message)
                    }
                    this.loading = false
                }).catch(err => {
                    this.showMessage('error', err.message)
                    this.loading = false
                })
            },
            showMessage(type, message) {
                this.$message({
                    message: message,
                    type: type,
                });
            },
            getDatabaseConfig() {
                axios.get('/database/config').then(res => {
                    if (res.data.code === 200) {
                        this.databases = JSON.parse(res.data.data);
                    } else {
                        this.showMessage('error', res.data.message)
                    }
                }).catch(err => {
                    this.showMessage('error', err.message)
                })
            }
        }
    });
</script>
</body>
</html>
