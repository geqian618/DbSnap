<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>连接数据库</title>
    <link rel="icon" type="image/x-icon" href="/icon/favicon.ico">
    <script src="/js/axios.min.js"></script>
    <script src="/js/vue.js"></script>
    <!-- 引入样式 -->
    <link rel="stylesheet" href="/css/element.css">
    <link rel="stylesheet" href="/css/normalize.css">
    <!-- 引入组件库 -->
    <script src="/js/element.js"></script>

    <link rel="stylesheet" href="/css/index.css">

</head>
<body>
<div id="app">
    <div class="container">
        <div class="action-items">
            <el-tooltip class="item" effect="dark" content="前往Gitee" placement="bottom">
                <a href="https://gitee.com/geqian618/DbSnap">
                    <img src="/icon/svg/gitee.svg" width="35" alt="gitee">
                </a>
            </el-tooltip>
            <el-tooltip class="item" effect="dark" content="前往Github" placement="bottom">
                <a href="https://github.com/geqian618/DBSnap">
                    <img src="/icon/svg/github.svg" width="35" alt="github">
                </a>
            </el-tooltip>

            <el-popover placement="bottom" width="300" trigger="hover">
                <img src="/images/赞赏码.jpg" width="300" alt="赞赏码">
                <img slot="reference" src="/icon/svg/admire.svg" width="35" alt="赞赏">
            </el-popover>

        </div>
        <div class="icon-grid">
            <div class="icon-item unselectable"
                 v-for="(database, index) in databases"
                 v-if="database.developed"
                 :key="index"
                 @click="selectDatabase(database)">
                <img :src="database.icon" width="100" height="100" alt=""/>
                <span>{{ database.aliasName || database.type }}</span>
            </div>
        </div>
    </div>

    <el-dialog v-loading="loading"
               element-loading-text="正在加载中..."
               element-loading-spinner="el-icon-loading"
               element-loading-background="rgba(0, 0, 0, 0.8)"
               width="600px"
               title="连接数据库"
               destroy-on-close
               @close="handleClose"
               @closed="handleClosed"
               :visible.sync="dialogFormVisible">
        <el-form :model="form" :rules="rules" ref="ruleForm">
            <el-form-item v-for="({key,label}, index) in properties"
                          :key="index"
                          :label="label"
                          :label-width="formLabelWidth"
                          :prop="key">
                <el-input v-model="form[key]"
                          :placeholder="`请输入${label}`"
                          :show-password="key === 'password'">
                </el-input>
            </el-form-item>
        </el-form>

        <div slot="footer" class="dialog-footer">
            <el-button @click="dialogFormVisible = false">取 消</el-button>
            <el-button type="primary" @click="submitForm('ruleForm')">确 定</el-button>
        </div>
    </el-dialog>
</div>

<script th:inline="javascript">
    // 创建一个新的 Vue 实例
    new Vue({
        el: '#app',
        data: {
            dialogFormVisible: false,
            formLabelWidth: '120px',
            loading: false,
            databases: [],
            properties: [],
            form: {},
            rules: {},
        },
        mounted() {
            this.getDatabaseConfig()
            this.handleKeyDown();
        },
        methods: {
            handleKeyDown() {
                document.addEventListener('keydown', (event) => {
                    if (event.key === 'Enter') {
                        this.submitForm('ruleForm')
                    }
                });
            },
            selectDatabase(args) {
                this.dialogFormVisible = true;
                if (args && typeof args === 'object') {
                    const newRules = {}
                    // 遍历传入对象的每个键值对
                    for (const [key, value] of Object.entries(args)) {
                        if (key === 'properties' && Array.isArray(value)) {
                            for (const {key: propKey, value: propValue, label, required = false} of value) {
                                this.$set(this.form, propKey, propValue);
                                newRules[propKey] = [{
                                    required,
                                    message: `${label}不能为空`,
                                    trigger: 'blur'
                                }]
                            }
                            this.properties = value;
                        } else {
                            // 普通值直接赋值
                            this.$set(this.form, key, value);
                        }
                    }
                    this.rules = newRules;
                }
            },
            submitForm(formName) {
                this.$refs[formName].validate((valid) => {
                    if (valid) {
                        this.connection()
                    } else {
                        return false;
                    }
                });
            },
            handleClose() {
                this.$nextTick(() => {
                    if (this.$refs.ruleForm) {
                        this.$refs.ruleForm.clearValidate();
                    }
                });
            },
            handleClosed() {
                this.form = {};
                this.rules = {};
                this.properties = [];
            },
            connection() {
                this.loading = true
                axios.post('/dataSource/connection', this.form).then(res => {
                    if (res.data.code === 200) {
                        this.showMessage('success', res.data.message)
                        setTimeout(() => {
                            window.location.href = '/document';
                        }, 500)
                    } else {
                        this.showMessage('error', res.data.message)
                    }
                    this.loading = false
                }).catch(err => {
                    this.showMessage('error', err.message)
                    this.loading = false
                })
            },
            showMessage(type, message) {
                this.$message({
                    message: message,
                    type: type,
                });
            },
            getDatabaseConfig() {
                axios.get('/database/config').then(res => {
                    if (res.data.code === 200) {
                        this.databases = JSON.parse(res.data.data);
                    } else {
                        this.showMessage('error', res.data.message)
                    }
                }).catch(err => {
                    this.showMessage('error', err.message)
                })
            }
        }
    });
</script>
</body>
</html>
